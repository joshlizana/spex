[project]
name = "spex"
version = "0.1.0"
description = "A Bluesky Jetstream v2 data pipeline with terminal operations and analytics interfaces"
readme = "README.md"
authors = [
    { name = "Joshua Lizana", email = "josh.lizana@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aioduckdb>=0.1.0",
    "aiosqlite>=0.22.1",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "platformdirs>=4.11.3",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "streamlit>=1.61.1",
    "structlog>=26.1.0",
    "textual>=8.2.8",
    "websockets>=16.1.1",
]

[project.scripts]
spex = "spex:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
